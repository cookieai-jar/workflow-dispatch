name: Retrieve logs

on:
  workflow_dispatch:

jobs:
  echo:
    runs-on: ubuntu-24.04
    steps:
      - name: Echo message
        run: |
          for i in {1..500}
          do
            echo "Hello $i"
            sleep 0.1
          done

  timeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Sleep
        run: sleep 1200s

  more-real-example:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Some command with npx
      run: |
        npx create-react-app example-app
